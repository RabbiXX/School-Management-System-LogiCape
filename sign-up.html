<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management System Sign Up Page</title>
  <link rel="shortcut icon" href="images/school-logo.png" type="image/x-icon">
  <link rel="stylesheet" href="bootstrap-5.0.2-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

  <style>
    .box-area {
      width: 930px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="student_mgmt_sys.html">Logi<span class="text-danger fw-bold">Cape</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="student_mgmt_sys.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about-us.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Gallery</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sign-in.html">Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container d-flex justify-content-center mt-5">
    <div class="row border rounder-5 p-3 bg-white shadow box-area">

      <div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box">
        <div class="logo mb-3">
          <img src="images/school-logo.png" class="img-fluid" style="width: 250px;">
        </div>
        <p class="text-dark fs-2" style="font-weight: 600;">LogiCape</p>
        <small class="text-wrap text-center" style="width: 17rem;">The Academy for problem solvers</small>
      </div>

      <div class="col-md-6 right-box">
        <div class="row align-items-center">
          <div class="header-text mb-4 text-center">
            <h3 class="my-2">Welcome to LogiCape</h3>
            <h5>Create Account</h5>
          </div>
          <div class="input-group mb-3 d-flex- justify-content-between">
            <form style="max-width: 400px; margin:auto;">
              <label class="sr-only w-100 mb-3">
                <input type="text" class="form-control" placeholder="Username" required autofocus>
              </label>
              <label class="sr-only w-100 mb-3">
                <input type="email" id="emailAddress" class="form-control" placeholder="Email address" required
                  autofocus>
              </label>
              <label class="sr-only w-100 ">
                <input type="password" id="password" class="form-control mb-3 rounded-5" placeholder="Password" required
                  autofocus>
              </label>
            </form>
          </div>
          <div class="input-group mb-3">
            <button class="btn btn-lg btn-primary w-100 fs-6">Create Account</button>
          </div>
          <div>
            <p>Alredy have an account? <a class="text-decoration-none" href="sign-in.html">Sign In </a>here</p>
          </div>
        </div>
      </div>
    </div>
  </div>






























  <script src="bootstrap-5.0.2-dist/js/bootstrap.bundle.js"></script>

</html>
